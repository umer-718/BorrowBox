<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | BorrowBox</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="navbar">
    <div class="container nav-inner">
        <a href="/" class="logo">BorrowBox</a>
        <a href="/" class="muted">Back to home</a>
    </div>
</nav>

<div class="container">
    <form id="loginForm" class="form-card">
        <h1>Welcome back</h1>
        <p class="muted">Login to your BorrowBox account.</p>

        <div id="message" class="message"></div>

        <div class="form-group">
            <label>Email address</label>
            <input
                type="email"
                name="email"
                required
                placeholder="you@example.com"
            >
        </div>

        <div class="form-group">
            <label>Password</label>
            <input
                type="password"
                name="password"
                required
                minlength="8"
                placeholder="Enter your password"
            >
        </div>

        <button class="btn btn-primary form-submit">
            Login
        </button>

        <p class="muted" style="text-align:center;margin-top:20px">
            Don't have an account?
            <a href="/register.html" style="color:#315cce">
                Create account
            </a>
        </p>
    </form>
</div>

<script src="/js/common.js"></script>
<script src="/js/auth.js"></script>

</body>
</html>
